<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">MITY — Clipping Automation</title>
  <desc id="desc">MITY ASCII wordmark in the project's cyan terminal color.</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g fill="#00D7FF" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="27" font-weight="700" text-anchor="middle" xml:space="preserve" filter="url(#softGlow)">
    <text x="450" y="74">  __  __ ___ _____ __   __</text>
    <text x="450" y="112"> |  \/  |_ _|_   _|\ \ / /</text>
    <text x="450" y="150"> | |\/| || |  | |  \ V /</text>
    <text x="450" y="188"> | |  | || |  | |   | |</text>
    <text x="450" y="226"> |_|  |_|___| |_|   |_|</text>
  </g>
  <text x="450" y="258" fill="#00D7FF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="5" text-anchor="middle">CLIPPING AUTOMATION</text>
</svg>
